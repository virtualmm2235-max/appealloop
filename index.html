<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appealloop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #182238;
      text-align: center;
    }
    header {
      background: #172554;
      color: white;
      padding: 24px;
      font-size: 26px;
      font-weight: bold;
    }
    main {
      padding: 55px 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 { font-size: 36px; }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #536078;
    }
    button {
      background: #4f46e5;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 15px 24px;
      font-size: 17px;
      cursor: pointer;
    }
    #message {
      margin-top: 24px;
      color: #3730a3;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>Appealloop</header>
  <main>
    <h1>Welcome to Appealloop</h1>
    <p>A fresh start begins here. We're building something useful, one step at a time.</p>
    <button onclick="document.getElementById('message').textContent='Thanks for visiting Appealloop! More is coming soon.'">
      Get Started
    </button>
    <div id="message"></div>
  </main>
</body>
</html>
